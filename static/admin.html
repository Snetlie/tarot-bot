<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Админ-панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0916; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.1); --line:rgba(255,255,255,.11); --text:#f4f0fb;
  --muted:#9b96b6; --gold:#e6c675; --gold2:#f8e6b0; --violet:#8b6cf0; --green:#6fe3a5; --rose:#ff94a8;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif; --serif:"Cormorant Garamond",Georgia,serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; background: radial-gradient(520px 400px at 90% -6%, rgba(139,108,240,.34), transparent 70%), var(--bg);
  background-attachment: fixed; color: var(--text); font: 15px/1.5 var(--sans); min-height: 100vh; }
main { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
.hidden { display: none !important; }
header { display:flex; align-items:center; justify-content:space-between; padding: 20px 0 8px; }
h1 { font: 700 26px var(--serif); margin: 0; background: linear-gradient(90deg,var(--gold2),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
h1 small { display:block; font: 400 12px var(--sans); color: var(--muted); -webkit-text-fill-color: var(--muted); }
.ref { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--glass2); color:var(--text); font-size:18px; cursor:pointer; }
.ref.spin { animation: sp .8s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }

.stats { display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin: 12px 0; }
.stat { background:var(--glass); border:1px solid var(--line); border-radius:18px; padding:14px; }
.stat b { display:block; font: 700 28px/1.1 var(--serif); color: var(--gold2); }
.stat span { font-size:12px; color:var(--muted); }
.stat i { font-style:normal; font-size:12px; color:var(--green); margin-left:6px; }
.card { background:var(--glass); border:1px solid var(--line); border-radius:20px; padding:16px; margin: 10px 0; }
.card h3 { margin:0 0 10px; font: 600 12px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--gold); }
.chart { display:flex; align-items:flex-end; gap:4px; height:70px; }
.chart div { flex:1; border-radius:4px 4px 0 0; min-height:3px; background: linear-gradient(180deg, var(--violet), rgba(139,108,240,.3)); position:relative; }
.chart.g div { background: linear-gradient(180deg, var(--gold), rgba(230,198,117,.25)); }
.chart div.z { opacity:.25; }
.axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; }

.tabs { display:flex; gap:6px; padding:4px; background:var(--glass); border:1px solid var(--line); border-radius:14px; margin: 16px 0 10px; }
.tab { flex:1; border:0; background:none; color:var(--muted); font:500 14px var(--sans); padding:10px; border-radius:10px; cursor:pointer; }
.tab.on { background: rgba(139,108,240,.3); color: var(--text); }
input[type=search] { width:100%; background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:14px; padding:12px 14px; color:var(--text); font:16px var(--sans); outline:none; margin-bottom:10px; }
.row { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:16px; background:var(--glass); border:1px solid var(--line); margin-bottom:8px; cursor:pointer; }
.row:active { background:var(--glass2); }
.av { width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:600; color:#251b06; background: linear-gradient(135deg,var(--gold2),var(--gold)); }
.row .m { min-width:0; flex:1; }
.row b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row small { color:var(--muted); font-size:12.5px; }
.row .r { text-align:right; flex:none; font-size:12px; color:var(--muted); }
.row .r b { color: var(--gold2); font-size:15px; }
.pill { font-size:11px; padding:2px 9px; border-radius:99px; background:rgba(111,227,165,.15); color:var(--green); }
.pill.w { background:rgba(255,148,168,.15); color:var(--rose); } .pill.p { background:rgba(230,198,117,.15); color:var(--gold); }
.empty { text-align:center; color:var(--muted); padding:34px 10px; border:1px dashed var(--line); border-radius:18px; }
.more { width:100%; padding:12px; margin-top:4px; border-radius:14px; border:1px solid var(--line); background:none; color:var(--muted); font:14px var(--sans); cursor:pointer; }

.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; display:flex; align-items:flex-end; justify-content:center; }
.sheet { width:100%; max-width:640px; max-height:86vh; overflow:auto; background:#15112e; border:1px solid var(--line); border-radius:26px 26px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); animation: up .3s ease; }
@keyframes up { from { transform: translateY(40px); opacity:0; } }
.sheet h2 { margin:0; font: 700 24px var(--serif); color:var(--gold2); }
.kv { display:grid; grid-template-columns: auto 1fr; gap:6px 14px; margin:12px 0; font-size:14px; }
.kv span { color:var(--muted); }
.rd { padding:10px 0; border-top:1px solid var(--line); }
.rd small { color:var(--muted); display:block; }
.lock { text-align:center; padding: 90px 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div id="lock" class="lock hidden"></div>
  <div id="app" class="hidden">
    <header>
      <h1>Админ-панель<small id="upd"></small></h1>
      <button class="ref" id="ref" aria-label="Обновить">↻</button>
    </header>

    <div class="stats" id="stats"></div>

    <div class="card"><h3>Новые пользователи · 14 дней</h3><div class="chart" id="chU"></div><div class="axis" id="axU"></div></div>
    <div class="card"><h3>Расклады · 14 дней</h3><div class="chart g" id="chR"></div><div class="axis" id="axR"></div></div>

    <div class="tabs">
      <button class="tab on" data-t="users">Пользователи</button>
      <button class="tab" data-t="pay">Оплаты</button>
    </div>
    <section id="tUsers">
      <input type="search" id="find" placeholder="Поиск: имя, @username или ID">
      <div id="users"></div>
    </section>
    <section id="tPay" class="hidden"><div id="pays"></div></section>
  </div>
</main>
<div class="sheet-bg hidden" id="bg"><div class="sheet" id="sheet"></div></div>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('#0a0916'); tg.setBackgroundColor('#0a0916'); } catch (e) {}
const $ = id => document.getElementById(id);
let data = null, shown = 50;

async function api(path, body) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json','X-Init-Data':tg.initData}, body: JSON.stringify(body || {})});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 90) return 'только что'; if (s < 3600) return Math.floor(s / 60) + ' мин назад';
  if (s < 86400) return Math.floor(s / 3600) + ' ч назад'; if (s < 86400 * 30) return Math.floor(s / 86400) + ' дн назад';
  return fmtDate(ts).slice(0, 8);
}
const money = (n, cur) => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2}).format(n) + ' ' + (cur || '₽');
const name = u => [u.first_name, u.last_name].filter(Boolean).join(' ') || (u.username ? '@' + u.username : 'ID ' + u.id);

function renderStats() {
  const s = data.stats, box = $('stats'); box.innerHTML = '';
  [['Пользователей', s.users, s.new_today ? '+' + s.new_today + ' сегодня' : ''], ['Активны за 7 дней', s.active_7d, ''],
   ['Раскладов', s.readings, s.readings_today ? '+' + s.readings_today + ' сегодня' : ''], ['Сообщений всего', s.messages, ''],
   ['Выручка', money(s.paid_total), ''], ['Оплат', s.paid_count, '']].forEach(([l, v, d]) => {
    const c = el('div', 'stat'); const b = el('b', '', v); c.appendChild(b);
    const sp = el('span', '', l); if (d) sp.appendChild(el('i', '', d)); c.appendChild(sp); box.appendChild(c);
  });
}
function chart(id, axis, arr) {
  const max = Math.max(1, ...arr.map(x => x.n)), c = $(id); c.innerHTML = '';
  arr.forEach(x => { const d = el('div', x.n ? '' : 'z'); d.style.height = Math.max(4, x.n / max * 100) + '%'; d.title = x.d + ': ' + x.n; c.appendChild(d); });
  $(axis).innerHTML = ''; $(axis).appendChild(el('span', '', arr[0].d.slice(5).split('-').reverse().join('.')));
  $(axis).appendChild(el('span', '', 'макс. ' + max)); $(axis).appendChild(el('span', '', 'сегодня'));
}
function renderUsers() {
  const q = $('find').value.trim().toLowerCase().replace(/^@/, '');
  const list = data.users.filter(u => !q || String(u.id).includes(q) || (u.username || '').toLowerCase().includes(q) || name(u).toLowerCase().includes(q));
  const box = $('users'); box.innerHTML = '';
  if (!list.length) { box.appendChild(el('div', 'empty', 'Никого не найдено')); return; }
  list.slice(0, shown).forEach(u => {
    const r = el('div', 'row'); r.appendChild(el('div', 'av', name(u).replace('@', '').slice(0, 1).toUpperCase()));
    const m = el('div', 'm'); m.appendChild(el('b', '', name(u)));
    m.appendChild(el('small', '', (u.username ? '@' + u.username + ' · ' : '') + 'ID ' + u.id)); r.appendChild(m);
    const rt = el('div', 'r'); rt.appendChild(el('b', '', u.readings + ' расклад.')); rt.appendChild(el('div', '', ago(u.last_seen))); r.appendChild(rt);
    r.onclick = () => openUser(u.id); box.appendChild(r);
  });
  if (list.length > shown) { const b = el('button', 'more', 'Показать ещё (' + (list.length - shown) + ')'); b.onclick = () => { shown += 50; renderUsers(); }; box.appendChild(b); }
}
function renderPays() {
  const box = $('pays'); box.innerHTML = '';
  if (!data.payments.length) { box.appendChild(el('div', 'empty', 'Оплат пока нет. Здесь появятся платежи, когда вы подключите оплату.')); return; }
  data.payments.forEach(p => {
    const r = el('div', 'row'); const m = el('div', 'm');
    m.appendChild(el('b', '', money(p.amount, p.currency)));
    m.appendChild(el('small', '', (p.first_name || (p.username ? '@' + p.username : 'ID ' + p.uid)) + ' · ' + fmtDate(p.ts) + (p.provider ? ' · ' + p.provider : '')));
    r.appendChild(m);
    const st = el('span', 'pill ' + (p.status === 'paid' ? '' : p.status === 'pending' ? 'p' : 'w'), p.status === 'paid' ? 'оплачено' : p.status === 'pending' ? 'ожидает' : p.status);
    r.appendChild(st); r.onclick = () => openUser(p.uid); box.appendChild(r);
  });
}
async function openUser(id) {
  $('bg').classList.remove('hidden'); const sh = $('sheet'); sh.innerHTML = ''; sh.appendChild(el('div', 'empty', 'Загрузка…'));
  try {
    const d = await api('/api/admin/user', {id}); const u = d.user; sh.innerHTML = '';
    if (!u) { sh.appendChild(el('div', 'empty', 'Пользователь не найден')); return; }
    sh.appendChild(el('h2', '', name(u)));
    const kv = el('div', 'kv');
    [['ID', u.id], ['Username', u.username ? '@' + u.username : '—'], ['Язык', u.language || '—'], ['Дата рождения', u.birth_date ? u.birth_date.split('-').reverse().join('.') : '—'],
     ['Первый визит', fmtDate(u.first_seen)], ['Последний визит', fmtDate(u.last_seen)], ['Раскладов', u.readings]].forEach(([k, v]) => { kv.appendChild(el('span', '', k)); kv.appendChild(el('div', '', v)); });
    sh.appendChild(kv);
    if (u.username) { const a = el('a', 'more', 'Открыть в Telegram'); a.href = 'https://t.me/' + u.username; a.style.cssText = 'display:block;text-align:center;text-decoration:none'; a.onclick = e => { e.preventDefault(); tg.openTelegramLink(a.href); }; sh.appendChild(a); }
    sh.appendChild(el('h3', '', 'Оплаты')); sh.lastChild.style.cssText = 'font:600 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin:18px 0 4px';
    if (!d.payments.length) sh.appendChild(el('small', '', 'Нет оплат')); d.payments.forEach(p => sh.appendChild(el('div', 'rd', money(p.amount, p.currency) + ' · ' + p.status + ' · ' + fmtDate(p.ts))));
    sh.appendChild(el('h3', '', 'Последние обращения')); sh.lastChild.style.cssText = 'font:600 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin:18px 0 4px';
    if (!d.readings.length) sh.appendChild(el('small', '', 'Пока ничего'));
    const kind = {reading: 'Расклад', followup: 'Уточнение', deep_dive: 'Глубокий разбор'};
    d.readings.forEach(r => { const x = el('div', 'rd'); x.appendChild(el('div', '', (kind[r.kind] || r.kind) + (r.spread ? ' · ' + r.spread : '') + (r.question ? ': ' + r.question : '')));
      x.appendChild(el('small', '', fmtDate(r.ts))); sh.appendChild(x); });
  } catch (e) { sh.innerHTML = ''; sh.appendChild(el('div', 'empty', 'Ошибка загрузки')); }
}
$('bg').onclick = e => { if (e.target === $('bg')) $('bg').classList.add('hidden'); };

async function load() {
  $('ref').classList.add('spin');
  try {
    data = await api('/api/admin/overview');
    $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
    renderStats(); chart('chU', 'axU', data.series.users); chart('chR', 'axR', data.series.readings); renderUsers(); renderPays();
    $('upd').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
  } catch (e) {
    $('app').classList.add('hidden'); $('lock').classList.remove('hidden');
    $('lock').textContent = tg.initData ? 'Нет доступа.' : 'Откройте панель из Telegram.';
  }
  $('ref').classList.remove('spin');
}
$('ref').onclick = load;
$('find').oninput = () => { shown = 50; renderUsers(); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('tUsers').classList.toggle('hidden', t.dataset.t !== 'users'); $('tPay').classList.toggle('hidden', t.dataset.t !== 'pay');
});
load();
</script>
</body>
</html>
